<!DOCTYPE html>
<html lang="id">
<head>

    <title>Toko Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Toko Dunia Komputer</h1>

    <div class="container">
        <div class="box">
            <h2>Daftar Produk</h2>

        </div>

        <div class="box">

            <br>
            <button id="btn-checkout">Checkout</button>
            <div id="ringkasan"></div>
        </div>
    </div>

    <script src="script.js"></script>

</html>
